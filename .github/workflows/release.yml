name: Release from CHANGELOG

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release if new version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Extract the top version heading, e.g. "## [0.6.0] — 2026-10-11"
          VERSION=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '[]' || true)
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md"
            exit 0
          fi
          TAG="v$VERSION"
          echo "Latest CHANGELOG version: $TAG"

          # Skip if the tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Nothing to do."
            exit 0
          fi

          # Extract the notes for this version (up to the next ## heading)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "## \\[" ver "\\]" { p=1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md | sed '/^$/d')

          echo "Creating release $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target main
