<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashward Tester</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #12100e; color: #f4ecdf; margin: 0; padding: 20px; max-width: 50rem; margin-inline: auto; }
    h1 { color: #e0a15a; }
    button { font-size: 1.1rem; padding: 14px 18px; margin: 6px 4px; background: #e0a15a; color: #1b140c; border: 0; border-radius: 10px; cursor: pointer; }
    button.secondary { background: #3c342c; color: #f4ecdf; }
    button:disabled { opacity: 0.5; }
    #log { background: #1a1714; border: 1px solid #3c342c; border-radius: 10px; height: 320px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    #summary { background: #221c17; border-radius: 10px; padding: 12px; margin-top: 12px; white-space: pre-wrap; }
    label { display: block; margin: 8px 0; }
    input { font-size: 1rem; padding: 6px; border-radius: 6px; border: 1px solid #3c342c; background: #221c17; color: #f4ecdf; }
    .note { color: #b7aa96; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Ashward Balance Tester</h1>
  <p>This runs the colony in the background and watches how food, scrap, and nights go. No commands needed.</p>
  <p class="note">Double-click this file to open it. Leave the page open. Click Halt when you want to stop.</p>

  <label>Stop after this many hours (leave blank to run until you click Halt):<br>
    <input id="hours" type="number" min="1" placeholder="e.g. 500 or blank for forever" style="width: 16rem;">
  </label>

  <button id="start">Start Tester</button>
  <button id="halt" class="secondary" disabled>Halt</button>
  <button id="summaryBtn" class="secondary" disabled>Show Numbers</button>
  <button id="narrativeBtn" class="secondary" disabled>Get Story Summary</button>

  <h2>What is happening</h2>
  <div id="log"></div>
  <div id="summary"></div>

  <script>
    // Core sim (kept close to the game). No AI used while running.
    const A = {
      loot: [
        { name: 'sealed tin', stock: 'food', n: 2 },
        { name: 'coil of wire', stock: 'scrap', n: 3 },
        { name: 'clinic packet', stock: 'meds', n: 1 },
        { name: 'half box of rounds', stock: 'ammo', n: 1 },
        { name: 'dry battery', stock: 'power', n: 2 },
        { name: 'can of fuel', stock: 'power', n: 1 },
      ],
      districts: ['Cinder Market', 'Rail Cut', 'Glass Orchard', 'Pump Row'],
    };

    let state, stats, running = false, timer = null, maxHours = Infinity;

    function blank() {
      return {
        hour: 8, day: 1, threat: 5, gate: 4,
        buildings: { garden: 1, clinic: 0, watch: 1, wall: 1 },
        stocks: { food: 28, scrap: 14, meds: 5, ammo: 8, power: 10 },
        people: [
          { name: 'Mara', job: 'garden', hunger: 1, fatigue: 1, cond: 'ready', trait: 'careful', doing: 'on shift' },
          { name: 'Ivo', job: 'scrap', hunger: 2, fatigue: 1, cond: 'ready', trait: 'stubborn', doing: 'on shift' },
          { name: 'Sera', job: 'watch', hunger: 1, fatigue: 0, cond: 'ready', trait: 'quiet', doing: 'on shift' },
          { name: 'Penn', job: 'unassigned', hunger: 1, fatigue: 0, cond: 'ready', trait: 'hungry', doing: 'looking for work' },
        ],
        districts: [{ name: 'Ashward Yard' }],
        log: [],
      };
    }

    function clockHour() { return state.hour % 24; }
    function onShift() { const h = clockHour(); return h >= 7 && h < 15; }
    function night() { const h = clockHour(); return h >= 20 || h < 5; }
    function usable(p) { return p.cond === 'ready' || p.cond === 'tired'; }

    function addLog(line) {
      const el = document.getElementById('log');
      el.textContent += line + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function labor(p) {
      if (!usable(p)) return 0;
      const tired = p.cond === 'tired' ? 0.6 : 1;
      const hrs = onShift() && p.job !== 'unassigned' ? 1 : 0.45;
      return hrs * tired;
    }

    function meal(p) {
      if (p.cond === 'missing') return 0;
      const base = p.trait === 'hungry' ? 0.22 : 0.16;
      return base + (p.doing === 'on shift' ? 0.06 : 0.02);
    }

    function rates() {
      const beds = Math.max(1, state.buildings.garden || 1);
      const yield_ = 1.2 * (1 - Math.exp(-beds / 2));
      let food = 0, scrap = 0, power = 0;
      state.people.forEach(p => {
        const l = labor(p);
        if (p.job === 'garden') food += l * (2.2 + yield_);
        if (p.job === 'scrap') { scrap += l * 1.8; power += l * 0.4; }
        if (p.job === 'unassigned' && p.doing === 'picking up odd jobs') scrap += 0.4;
      });
      const foodUse = state.people.reduce((n, p) => n + meal(p), 0);
      const medUse = state.people.some(p => p.job === 'clinic' && usable(p)) && state.buildings.clinic && state.people.some(p => p.cond === 'injured') ? 0.25 : 0;
      const ammoUse = night() ? state.people.filter(p => p.job === 'watch' && usable(p)).length * 0.15 : 0;
      return { food: {make: food, use: foodUse}, scrap: {make: scrap, use: 0}, meds: {make: 0, use: medUse}, ammo: {make: 0, use: ammoUse}, power: {make: power, use: 0.35} };
    }

    function streets() { return state.districts.filter(d => d.name !== 'Ashward Yard'); }

    function steward(p) {
      const s = streets().length;
      const scores = [
        { task: 'resting', score: p.fatigue * 2 + (p.cond === 'tired' ? 3 : 0) },
        { task: 'looking for a meal', score: p.hunger * 1.4 },
        { task: 'checking the gate', score: Math.max(0, state.threat - state.gate) },
        { task: 'picking up odd jobs', score: state.stocks.scrap < 8 ? 2 : 0.4 },
        { task: 'sitting with the injured', score: state.people.some(q => q.cond === 'injured') ? 2.5 : 0 },
        { task: 'scavenging a street', score: s ? (state.stocks.scrap < 10 ? 2.2 : 1.3) : 0 },
      ];
      scores.sort((a, b) => b.score - a.score);
      return scores[0];
    }

    function tryLoot(p) {
      if (p.doing !== 'scavenging a street' || !p.street) return;
      if (Math.random() > 0.4) return;
      const find = A.loot[Math.floor(Math.random() * A.loot.length)];
      state.stocks[find.stock] = (state.stocks[find.stock] || 0) + find.n;
      stats.loot += 1;
      addLog(`${p.name} brings back a ${find.name} from ${p.street}`);
    }

    function tick() {
      state.hour += 1;
      if (state.hour % 24 === 0) state.day += 1;
      stats.hours += 1;
      const shift = onShift();

      state.people.forEach(p => {
        if (p.cond === 'missing') { p.doing = 'missing'; return; }
        if (p.cond === 'injured') { p.doing = 'lying up'; return; }
        if (shift && p.job !== 'unassigned') {
          p.doing = 'on shift'; p.street = null; p.fatigue = Math.min(8, p.fatigue + 0.4);
        } else {
          const c = steward(p);
          p.doing = c.task;
          if (c.task === 'scavenging a street' && !p.street && streets().length) {
            const list = streets();
            p.street = list[Math.floor(Math.random() * list.length)].name;
          } else if (c.task !== 'scavenging a street') p.street = null;
          p.fatigue = Math.max(0, p.fatigue - (c.task === 'resting' ? 1 : 0.3));
          if (p.cond === 'tired' && p.fatigue < 2) p.cond = 'ready';
          tryLoot(p);
        }
      });

      const r = rates();
      state.stocks.food = Math.max(0, state.stocks.food + r.food.make - r.food.use);
      state.stocks.scrap += r.scrap.make;
      state.stocks.power = Math.max(0, state.stocks.power + r.power.make - r.power.use);
      state.stocks.ammo = Math.max(0, state.stocks.ammo - r.ammo.use);
      state.stocks.meds = Math.max(0, state.stocks.meds - r.meds.use);

      state.people.forEach(p => {
        if (p.cond === 'missing') return;
        p.hunger = state.stocks.food > 0 ? Math.max(0, p.hunger - 0.4) : p.hunger + 1;
        if (p.hunger > 6) p.cond = 'tired';
      });

      if (state.stocks.food <= 0) stats.foodZero += 1;
      if (state.stocks.scrap < 5) stats.scrapLow += 1;
      stats.minFood = Math.min(stats.minFood, state.stocks.food);
      stats.minScrap = Math.min(stats.minScrap, state.stocks.scrap);

      if (clockHour() === 21) {
        stats.nights += 1;
        const watch = state.people.filter(p => p.job === 'watch' && usable(p)).length;
        if (state.threat > state.gate + watch) {
          const v = state.people.find(usable);
          if (v) { v.cond = 'injured'; v.doing = 'lying up'; stats.injuries += 1; addLog(`${v.name} is brought in from the gate.`); }
        } else {
          stats.holds += 1;
          addLog('Night noise. The gate number holds.');
        }
      }

      if (stats.hours % 48 === 0 && state.stocks.food > 6 && Math.random() < 0.4) {
        const n = state.districts.length;
        const base = A.districts[n % A.districts.length];
        const name = n < A.districts.length ? base : `${base} ${n}`;
        state.districts.push({ name });
        state.stocks.food -= 3;
        addLog(`Scouted ${name}.`);
      }

      if (stats.hours % 24 === 0) addLog(`--- Day ${state.day} complete. Food ${state.stocks.food.toFixed(1)} Scrap ${state.stocks.scrap.toFixed(1)} ---`);
    }

    function getSummary() {
      return {
        hours: stats.hours,
        days: Math.floor(stats.hours / 24),
        nights: stats.nights,
        nightsHeld: stats.holds,
        injuries: stats.injuries,
        finds: stats.loot,
        hoursWithNoFood: stats.foodZero,
        hoursWithLowScrap: stats.scrapLow,
        lowestFood: stats.minFood === Infinity ? null : Math.round(stats.minFood * 10) / 10,
        lowestScrap: stats.minScrap === Infinity ? null : Math.round(stats.minScrap * 10) / 10,
        final: { ...state.stocks },
      };
    }

    function showNumbers() {
      const s = getSummary();
      document.getElementById('summary').textContent = JSON.stringify(s, null, 2);
    }

    async function getNarrative() {
      let key = localStorage.getItem('ashward-grok-key');
      if (!key) {
        key = prompt('Paste your Grok / xAI API key once (it stays only on this computer):');
        if (!key) return;
        localStorage.setItem('ashward-grok-key', key.trim());
      }
      const s = getSummary();
      document.getElementById('summary').textContent = 'Asking for a short story summary…';
      try {
        const res = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'grok-3',
            messages: [
              { role: 'system', content: 'You are a clear, calm colony analyst. In 4-6 plain sentences, tell what the numbers mean for a person who is not a gamer. Focus on whether the yard stays fed, whether nights are safe, and any worries. No gore.' },
              { role: 'user', content: JSON.stringify(s) },
            ],
            max_tokens: 300,
          }),
        });
        const j = await res.json();
        const text = j.choices?.[0]?.message?.content || JSON.stringify(j);
        document.getElementById('summary').textContent = text;
      } catch (e) {
        document.getElementById('summary').textContent = 'Could not reach the summary service. Here are the numbers instead:\n\n' + JSON.stringify(getSummary(), null, 2);
      }
    }

    document.getElementById('start').addEventListener('click', () => {
      if (running) return;
      const h = document.getElementById('hours').value;
      maxHours = h ? Number(h) : Infinity;
      state = blank();
      stats = { hours: 0, nights: 0, holds: 0, injuries: 0, loot: 0, foodZero: 0, scrapLow: 0, minFood: Infinity, minScrap: Infinity };
      document.getElementById('log').textContent = '';
      document.getElementById('summary').textContent = '';
      addLog('Tester started. Click Halt when you want to stop.');
      running = true;
      document.getElementById('start').disabled = true;
      document.getElementById('halt').disabled = false;
      document.getElementById('summaryBtn').disabled = true;
      document.getElementById('narrativeBtn').disabled = true;
      timer = setInterval(() => {
        if (stats.hours >= maxHours) { halt(); return; }
        tick();
      }, 20);
    });

    function halt() {
      if (!running) return;
      clearInterval(timer);
      running = false;
      addLog('\n--- Stopped ---');
      document.getElementById('start').disabled = false;
      document.getElementById('halt').disabled = true;
      document.getElementById('summaryBtn').disabled = false;
      document.getElementById('narrativeBtn').disabled = false;
      showNumbers();
    }

    document.getElementById('halt').addEventListener('click', halt);
    document.getElementById('summaryBtn').addEventListener('click', showNumbers);
    document.getElementById('narrativeBtn').addEventListener('click', getNarrative);
  </script>
</body>
</html>
